# AeroSpace: minimalistisches Kacheln für die deutsche Tastatur (QWERTZ)
#
# Hauptmodifikator ist Alt+Cmd. Er kollidiert nicht mit @ € ~ { } [ ] auf der
# deutschen Tastatur. Die Tasten sind physische Positionen in US-Notation
# (key-mapping.preset = 'qwerty'). Auf der deutschen Tastatur gilt deshalb:
#   slash              = Taste »-«      rightSquareBracket = Taste »+«
#   minus              = Taste »ß«      equal              = Taste »´«

config-version = 2
start-at-login = true
auto-reload-config = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'
accordion-padding = 0

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Kein Zwischenraum: jeder Pixel gehört den Fenstern
gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.bottom = 0
gaps.outer.top = 0
gaps.outer.right = 0

key-mapping.preset = 'qwerty'

# Fokus nur per Mausklick oder Tastatur, der Mauszeiger springt nie
focus-follows-mouse.enabled = false
on-focused-monitor-changed = []
on-focus-changed = []

# Hilfsfenster mit fester Größe schweben. Alle übrigen neuen Fenster ordnet
# auto-tile.sh an (1 Fenster Vollbild, 2 nebeneinander, 3 Master-Stack, 4 Raster).
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.ActivityMonitor', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.calculator', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.archiveutility', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.QuickTimePlayerX', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = ch.protonvpn.mac', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = us.zoom.xos', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.AppStore', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.DiskUtility', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.keychainaccess', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.ColorPicker', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.FontBook', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.Passwords', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.ScreenSharing', run = 'layout floating' },
    { if = 'true', run = 'exec-and-forget /bin/bash "$HOME/.config/aerospace/auto-tile.sh"' },
]

# Feste Zuordnung von Arbeitsbereichen zu Bildschirmen (Schreibtischen):
# Getrennte Bildschirme haben stets getrennte Arbeitsbereiche und interagieren nicht
[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
6 = [2, 'secondary', 1]
7 = [2, 'secondary', 1]
8 = [3, 2, 'secondary', 1]
9 = [3, 2, 'secondary', 1]

[mode.main.binding]
# Cmd+T holt Ghostty nach vorn und öffnet ein Fenster, wenn keines offen ist
cmd-t = 'exec-and-forget open -a Ghostty'

# Fenster schließen
alt-cmd-w = 'close'
alt-cmd-q = 'close --quit-if-last-window'

# Layout: S Ausrichtung, Komma Akkordeon an/aus, R Baum glätten, B Größen
# ausgleichen, Leertaste schweben/kacheln, F Vollbild
alt-cmd-s = 'layout horizontal vertical'
alt-cmd-comma = 'layout accordion tiles'
alt-cmd-r = 'flatten-workspace-tree'
alt-cmd-b = 'balance-sizes'
alt-cmd-space = 'layout floating tiling'
alt-cmd-f = 'fullscreen'

# Fenster zusammenlegen (gemeinsamer Container mit dem Nachbarn)
ctrl-alt-cmd-h = 'join-with left'
ctrl-alt-cmd-j = 'join-with down'
ctrl-alt-cmd-k = 'join-with up'
ctrl-alt-cmd-l = 'join-with right'
ctrl-alt-cmd-left = 'join-with left'
ctrl-alt-cmd-down = 'join-with down'
ctrl-alt-cmd-up = 'join-with up'
ctrl-alt-cmd-right = 'join-with right'

# Fokus (Vim-Tasten und Pfeile)
alt-cmd-h = 'focus left'
alt-cmd-j = 'focus down'
alt-cmd-k = 'focus up'
alt-cmd-l = 'focus right'
alt-cmd-left = 'focus left'
alt-cmd-down = 'focus down'
alt-cmd-up = 'focus up'
alt-cmd-right = 'focus right'

# Fenster verschieben
alt-cmd-shift-h = 'move left'
alt-cmd-shift-j = 'move down'
alt-cmd-shift-k = 'move up'
alt-cmd-shift-l = 'move right'
alt-cmd-shift-left = 'move left'
alt-cmd-shift-down = 'move down'
alt-cmd-shift-up = 'move up'
alt-cmd-shift-right = 'move right'

# Workspaces 1 bis 9
alt-cmd-1 = 'workspace 1'
alt-cmd-2 = 'workspace 2'
alt-cmd-3 = 'workspace 3'
alt-cmd-4 = 'workspace 4'
alt-cmd-5 = 'workspace 5'
alt-cmd-6 = 'workspace 6'
alt-cmd-7 = 'workspace 7'
alt-cmd-8 = 'workspace 8'
alt-cmd-9 = 'workspace 9'

alt-cmd-shift-1 = 'move-node-to-workspace 1'
alt-cmd-shift-2 = 'move-node-to-workspace 2'
alt-cmd-shift-3 = 'move-node-to-workspace 3'
alt-cmd-shift-4 = 'move-node-to-workspace 4'
alt-cmd-shift-5 = 'move-node-to-workspace 5'
alt-cmd-shift-6 = 'move-node-to-workspace 6'
alt-cmd-shift-7 = 'move-node-to-workspace 7'
alt-cmd-shift-8 = 'move-node-to-workspace 8'
alt-cmd-shift-9 = 'move-node-to-workspace 9'

alt-cmd-tab = 'workspace-back-and-forth'
alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Größe ändern: Taste »-« verkleinert, Taste »+« vergrößert (zusätzlich ß und ´)
alt-cmd-slash = 'resize smart -50'
alt-cmd-rightSquareBracket = 'resize smart +50'
alt-cmd-minus = 'resize smart -50'
alt-cmd-equal = 'resize smart +50'
alt-cmd-shift-r = 'mode resize'

# Dienst-Modus
alt-cmd-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
slash = 'resize smart -50'
rightSquareBracket = 'resize smart +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
b = ['balance-sizes', 'mode main']
esc = 'mode main'
enter = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-cmd-shift-h = ['join-with left', 'mode main']
alt-cmd-shift-j = ['join-with down', 'mode main']
alt-cmd-shift-k = ['join-with up', 'mode main']
alt-cmd-shift-l = ['join-with right', 'mode main']
